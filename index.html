<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Public Finance Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Theme 1 (default): Storybook — comic-panel ink outlines, Poppins + Inter */
  :root, [data-theme="storybook"] {
    --bg: #fff7e8; --card-bg: #ffffff; --text: #1f2430; --muted: #6a6455;
    --border: #1f2430; --border-w: 2.5px; --radius-card: 16px; --radius-pill: 999px;
    --accent: #e8402c; --accent-soft: #ffe3dc; --on-accent: #ffffff;
    --grid: #f0e4cf; --ok: #4caf6d; --ok-soft: #e3f5e9; --warn: #c98a1c; --warn-soft: #fbeecb;
    --font-display: 'Poppins', sans-serif; --font-heading: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif; --font-mono: 'Inter', sans-serif;
    --shadow-card: 3px 3px 0 var(--border); --shadow-btn: 2px 2px 0 var(--border);
  }
  /* Theme 2: Playground — saturated coral/blue/mustard/green, Fredoka + Nunito Sans */
  [data-theme="playground"] {
    --bg: #eef8ff; --card-bg: #ffffff; --text: #22252b; --muted: #5a5c66;
    --border: #eaf2fb; --border-w: 1px; --radius-card: 20px; --radius-pill: 999px;
    --accent: #ff5d5d; --accent-soft: #ffe3e3; --on-accent: #ffffff;
    --grid: #e3f0fb; --ok: #3dbe7a; --ok-soft: #e3f8ec; --warn: #d68a1f; --warn-soft: #fdf0d9;
    --font-display: 'Fredoka', sans-serif; --font-heading: 'Fredoka', sans-serif;
    --font-body: 'Nunito Sans', sans-serif; --font-mono: 'Nunito Sans', sans-serif;
    --shadow-card: 0 6px 0 rgba(20,30,60,.06); --shadow-btn: 0 4px 0 #d63f3f;
  }
  /* Theme 3: Arcade Cabinet — neon glow on near-black, Press Start 2P + VT323 + Inter */
  [data-theme="arcade"] {
    --bg: #0d0221; --card-bg: #160a30; --text: #f0eaff; --muted: #9d8bc9;
    --border: #3d2a66; --border-w: 2px; --radius-card: 6px; --radius-pill: 3px;
    --accent: #ff2bd6; --accent-soft: rgba(255,43,214,.14); --on-accent: #0d0221;
    --grid: #2a1a4a; --ok: #39ff14; --ok-soft: rgba(57,255,20,.12); --warn: #ffeb3b; --warn-soft: rgba(255,235,59,.12);
    --font-display: 'Press Start 2P', monospace; --font-heading: 'VT323', monospace;
    --font-body: 'Inter', sans-serif; --font-mono: 'VT323', monospace;
    --shadow-card: 0 0 0 1px var(--border), 0 0 16px rgba(255,43,214,.25); --shadow-btn: 0 0 10px rgba(255,43,214,.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body), -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  [data-theme="arcade"] body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 20px 80px; }
  header { text-align: center; margin-bottom: 24px; }
  .theme-toggle {
    display: inline-flex; gap: 4px; background: var(--card-bg); border: var(--border-w) solid var(--border);
    border-radius: 8px; padding: 3px; margin-bottom: 14px; box-shadow: var(--shadow-card);
  }
  .theme-btn {
    font-family: var(--font-body); font-size: 12px; font-weight: 600;
    border: none; background: transparent; color: var(--muted); border-radius: 6px;
    padding: 7px 14px; cursor: pointer; transition: background .12s, color .12s;
  }
  .theme-btn:hover:not(.active) { color: var(--text); }
  .theme-btn.active { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-btn); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    margin: 0 0 14px;
    line-height: 1.25;
  }
  [data-theme="arcade"] h1 { font-size: clamp(17px, 3.4vw, 26px); line-height: 1.7; }
  header p.sub {
    color: var(--muted);
    font-size: 16px;
    max-width: 620px;
    margin: 0 auto 8px;
  }
  [data-theme="arcade"] header p.sub { font-size: 15px; }

  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px; margin-top: 36px;
  }
  .tool-card {
    background: var(--card-bg); border: var(--border-w) solid var(--border); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 26px; text-align: left;
    display: flex; flex-direction: column;
  }
  .tool-card .tag-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .tool-card .tag {
    font-family: var(--font-heading); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
  }
  .status-pill {
    font-family: var(--font-body); font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: var(--radius-pill);
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .status-pill.is-checking { background: var(--grid); color: var(--muted); }
  .status-pill.is-checking .dot { background: var(--muted); }
  .status-pill.is-online { background: var(--ok-soft); color: var(--ok); }
  .status-pill.is-online .dot { background: var(--ok); }
  .status-pill.is-offline { background: var(--warn-soft); color: var(--warn); }
  .status-pill.is-offline .dot { background: var(--warn); }
  .tool-card h2 {
    font-family: var(--font-heading); font-weight: 700; font-size: 20px; margin: 0 0 10px; line-height: 1.35;
  }
  [data-theme="arcade"] .tool-card h2 { font-size: 23px; }
  .tool-card p {
    font-size: 14px; color: var(--muted); margin: 0 0 16px; flex-grow: 1;
  }
  [data-theme="arcade"] .tool-card p { font-size: 15px; }
  .tool-card .offline-help {
    font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 10px;
    padding: 10px 12px; margin: 0 0 16px; display: none;
  }
  [data-theme="arcade"] .tool-card .offline-help { font-size: 14px; }
  .tool-card .offline-help.show { display: block; }
  .tool-card .offline-help code {
    font-family: var(--font-mono); background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 4px;
  }
  .tool-actions { display: flex; gap: 8px; align-items: center; }
  .tool-btn {
    display: inline-block; text-decoration: none;
    font-family: var(--font-heading); font-weight: 600; font-size: 14px;
    background: var(--accent); color: var(--on-accent); border: none;
    border-radius: var(--radius-pill); padding: 12px 18px; cursor: pointer;
    box-shadow: var(--shadow-btn);
  }
  [data-theme="arcade"] .tool-btn { font-size: 15px; }
  .tool-btn:hover { filter: brightness(1.06); }
  .tool-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .recheck-btn {
    font-family: var(--font-body); font-weight: 600; font-size: 12.5px;
    background: none; color: var(--muted); border: var(--border-w) solid var(--grid);
    border-radius: var(--radius-pill); padding: 10px 14px; cursor: pointer;
  }
  .recheck-btn:hover { color: var(--text); border-color: var(--muted); }
  .recheck-btn:disabled { opacity: .5; cursor: default; }

  footer { margin-top: 56px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
  [data-theme="arcade"] footer { font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Public Finance Playground</h1>
  <p class="sub">A home base for public-finance tools — pick one below to open it in a new tab.</p>
</header>

<div class="cards-grid" id="cardsGrid"></div>

<footer>
  <div class="theme-toggle" id="themeToggle">
    <button class="theme-btn" data-theme-choice="storybook">Storybook</button>
    <button class="theme-btn" data-theme-choice="playground">Playground</button>
    <button class="theme-btn" data-theme-choice="arcade">Arcade</button>
  </div>
  <p>Public Finance Playground</p>
</footer>

</div>

<script>
// ---------- Theme (Storybook / Playground / Arcade) ----------
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('pfp-theme', theme); } catch (e) {}
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.themeChoice === theme);
  });
}
(function initTheme() {
  let saved = 'arcade';
  try { saved = localStorage.getItem('pfp-theme') || 'arcade'; } catch (e) {}
  document.documentElement.dataset.theme = saved;
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.themeChoice === saved);
    b.onclick = () => applyTheme(b.dataset.themeChoice);
  });
})();

// ---------- Tools ----------
// Add a new tool here to give it a card on the landing page — nothing else
// needs to change. Static tools (plain HTML files) just need `url`.
// Tools backed by a local server also need `checkUrl` (usually the same as
// `url`) so the card can show a live "starting… / ready / offline" status —
// and a matching start-server step should be added to
// "Open Public Finance Playground.command".
const TOOLS = [
  {
    title: "State Budget Analyser",
    tag: "Fiscal Report",
    desc: "Upload a state budget, CAG report, or fiscal document and get a structured analysis across different dimensions of public finance.",
    url: "https://sp19sedoc.github.io/state-fiscal-analyser/",
  },
  {
    title: "State Fiscal Indicators",
    tag: "Explorer",
    desc: "Fiscal indicators for every Indian state, computed from GSDP and state finance data.",
    url: "https://sp19sedoc.github.io/state-fiscal-indicators/state_fiscal_indicators_v0.7.html",
  },
  {
    title: "Where Did My Income Tax Go?",
    tag: "Spending Breakdown",
    desc: "Enter what you paid in income tax and see how the Union government spends your share.",
    url: "https://sp19sedoc.github.io/india-tax-tracker/",
  },
];

function renderTools() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = TOOLS.map((t, i) => `
    <div class="tool-card" data-tool-index="${i}">
      <div class="tag-row">
        <div class="tag">${t.tag}</div>
        ${t.checkUrl ? `<div class="status-pill is-checking" data-status><span class="dot"></span><span data-status-text>Checking…</span></div>` : ''}
      </div>
      <h2>${t.title}</h2>
      <p>${t.desc}</p>
      ${t.offlineHelp ? `<div class="offline-help" data-offline-help>${t.offlineHelp}</div>` : ''}
      <div class="tool-actions">
        <a class="tool-btn" href="${t.url}" target="_blank" rel="noopener">Open →</a>
        ${t.checkUrl ? `<button type="button" class="recheck-btn" data-recheck>Check again</button>` : ''}
      </div>
    </div>
  `).join('');

  TOOLS.forEach((t, i) => { if (t.checkUrl) checkStatus(i, t.checkUrl); });

  grid.querySelectorAll('[data-recheck]').forEach((btn, idx) => {
    const serverTools = TOOLS.map((t, i) => ({ t, i })).filter(x => x.t.checkUrl);
    const { t, i } = serverTools[idx];
    btn.onclick = () => {
      btn.disabled = true;
      checkStatus(i, t.checkUrl).finally(() => { btn.disabled = false; });
    };
  });
}

function checkStatus(index, checkUrl) {
  const card = document.querySelector(`.tool-card[data-tool-index="${index}"]`);
  const pill = card.querySelector('[data-status]');
  const label = card.querySelector('[data-status-text]');
  const help = card.querySelector('[data-offline-help]');
  pill.className = 'status-pill is-checking';
  label.textContent = 'Checking…';
  return fetch(checkUrl, { mode: 'no-cors', cache: 'no-store' })
    .then(() => {
      pill.className = 'status-pill is-online';
      label.textContent = 'Running';
      if (help) help.classList.remove('show');
    })
    .catch(() => {
      pill.className = 'status-pill is-offline';
      label.textContent = 'Not running';
      if (help) help.classList.add('show');
    });
}

renderTools();
</script>
</body>
</html>
